name: CI

# Runs on every pull request into main and every push to main. A person merges once these pass.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Checks only read the repository; nothing here writes back to it
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and publish dry run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Lint
        run: deno lint

      # Only Baseline widely available web features in the code a browser runs (jsr:@velotype/velobaseline)
      - name: Browser support
        run: deno task check-baseline

      # Type checks the package as JSR will see it, and finds a packaging problem now rather than
      # during a publish: a JSR version is immutable, so a bad one is permanent.
      - name: Publish dry run
        run: deno publish --dry-run

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The tests drive a real headless Chrome through Astral. The runner ships one, and pointing
      # Astral at it avoids a per-run download of its own copy.
      - name: Record the browser Astral should drive
        run: echo "CHROME_PATH=$(which google-chrome || which chromium-browser || which chromium)" >> "$GITHUB_ENV"

      # The test task bundles its test pages in parallel, and on a cold cache they race each other
      # extracting deno's bundled esbuild binary ("failed to copy esbuild binary"). Bundling one
      # first, alone, removes the race.
      - name: Warm the bundler's esbuild binary
        run: deno task bundle-basic-div
        working-directory: tests

      - name: Run the tests
        run: deno task test
